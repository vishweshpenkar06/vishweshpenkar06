<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'SF Mono', Menlo, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="55%" stop-color="#0D0B1F"/>
      <stop offset="100%" stop-color="#120A24"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="55%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#2A2440"/>
    </pattern>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bgGrad)"/>
  <rect width="900" height="300" rx="14" fill="url(#dots)" opacity="0.35"/>
  <rect width="900" height="300" rx="14" fill="url(#glow)"/>
  <rect x="1" y="1" width="898" height="298" rx="13" fill="none" stroke="#2D2450" stroke-width="1.5"/>

  <!-- terminal prompt line -->
  <text x="60" y="92" font-size="15" fill="#34D399">$ whoami</text>

  <!-- name -->
  <text x="58" y="150" font-size="52" font-weight="700" fill="url(#textGrad)" letter-spacing="1">VISHWESH PENKAR</text>

  <!-- role line -->
  <text x="60" y="188" font-size="19" fill="#C9D1D9">Aspiring Software Developer <tspan fill="#565F71">//</tspan> AI Systems &amp; Full-Stack Engineering</text>

  <!-- tag row -->
  <g font-size="13" fill="#8B949E">
    <rect x="58" y="212" width="118" height="28" rx="14" fill="#151226" stroke="#3B3364"/>
    <text x="72" y="230" fill="#A78BFA">◆ AI / ML</text>

    <rect x="186" y="212" width="150" height="28" rx="14" fill="#151226" stroke="#3B3364"/>
    <text x="200" y="230" fill="#22D3EE">◆ Full-Stack Web</text>

    <rect x="346" y="212" width="182" height="28" rx="14" fill="#151226" stroke="#3B3364"/>
    <text x="360" y="230" fill="#34D399">◆ Systems From Scratch</text>
  </g>

  <text x="60" y="266" font-size="13.5" fill="#565F71">Saraswati College of Engineering · Kharghar, India</text>
</svg>
